name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name RangeMatrix range_dashboard.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RangeMatrix-Windows
          path: dist/RangeMatrix.exe
